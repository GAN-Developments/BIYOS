# BIYOS Boot-Konfiguration
# Pfade beginnen an der Wurzel der ESP, '/' oder '\' ist egal.
kernel=/BIYOS/kernel.elf

# Sprache und Tastaturlayout (lang=de|en, layout=de|us)
lang=de
layout=de

# Module (BIYOS-Executables, Typ DRIV usw.) in dieser Reihenfolge laden
module=/BIYOS/modules/usbhid.drv
module=/BIYOS/modules/ahci.drv
